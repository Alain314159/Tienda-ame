backend:
  name: github
  repo: alain314159/Tienda-ame
  branch: main

media_folder: "static/images"
public_folder: "static/images"

collections:
  - name: "config"
    label: "Configuración"
    files:
      - name: "general"
        label: "Configuración de la tienda"
        file: "data/config.json"
        fields:
          - name: "whatsapp_number"
            label: "Número de WhatsApp (formato internacional)"
            widget: "string"
            hint: "Ej.: +34600123456 o 34600123456"
            pattern:
              - "^[+]?[0-9][0-9 ]{6,18}$"
              - "Introduce un número válido en formato internacional."
          - name: "store_name"
            label: "Nombre de la tienda"
            widget: "string"
          - name: "mensaje_bienvenida"
            label: "Mensaje de bienvenida del pedido"
            widget: "text"
          - name: "moneda"
            label: "Símbolo de moneda (ej.: $, Bs., S/)"
            widget: "string"
            hint: "Va delante del precio, ej.: $15.99"
            default: "$"

  - name: "productos"
    label: "Productos"
    files:
      - name: "catalogo"
        label: "Catálogo"
        file: "data/productos.json"
        fields:
          - name: "productos"
            label: "Productos"
            label_singular: "producto"
            widget: "list"
            summary: "🧶 {{fields.nombre}} · {{fields.precio}} · {{fields.estado}}"
            collapsed: true
            fields:
              - { name: "nombre", label: "Nombre", widget: "string" }
              - { name: "precio", label: "Precio base", widget: "number", value_type: "float", default: 0 }
              - name: "estado"
                label: "Estado"
                widget: "select"
                options: ["disponible", "bajo_pedido"]
                default: "disponible"
              - { name: "categoria", label: "Categoría", widget: "string", hint: "Ej.: Amigurumis, Llaveros, Accesorios", default: "Amigurumis" }
              - { name: "imagen", label: "Foto del producto", widget: "image", required: false }
              - { name: "descripcion", label: "Descripción", widget: "text", required: false }
              - name: "colores"
                label: "Colores disponibles"
                label_singular: "color"
                widget: "list"
                required: false
                collapsed: true
                summary: "🎨 {{fields.color}}"
                field: { name: "color", label: "Color", widget: "string" }
              - name: "accesorios"
                label: "Accesorios opcionales"
                label_singular: "accesorio"
                widget: "list"
                required: false
                collapsed: true
                summary: "🎀 {{fields.nombre}} (+{{fields.precio_extra}})"
                fields:
                  - { name: "nombre", label: "Nombre del accesorio", widget: "string" }
                  - { name: "precio_extra", label: "Precio extra", widget: "number", value_type: "float", default: 0 }
              - { name: "stock", label: "Stock (informativo)", widget: "number", value_type: "int", default: 0 }
              - { name: "id", label: "ID único (un número distinto por producto)", widget: "number", value_type: "int", default: 1 }
